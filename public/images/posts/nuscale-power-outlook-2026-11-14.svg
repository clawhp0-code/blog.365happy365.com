<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">뉴스케일파워 성장과 위험</title>
  <desc id="desc">2026년 11월 14일 기준 NuScale Power의 검증된 기술·재무·계약 단계</desc>
  <rect width="1200" height="630" fill="#f7fafc"/>
  <rect x="0" y="0" width="1200" height="12" fill="#0f766e"/>
  <text x="72" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">뉴스케일파워: 승인에서 매출까지</text>
  <text x="72" y="112" font-family="Arial, sans-serif" font-size="18" fill="#475569">NYSE: SMR · 기준일 2026-11-14 · 최신 확정 재무: 2026년 3분기</text>
  <g font-family="Arial, sans-serif">
