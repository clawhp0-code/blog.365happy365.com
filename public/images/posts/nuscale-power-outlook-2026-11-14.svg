  <text x="72" y="548" font-family="Arial, sans-serif" font-size="13" fill="#475569">출처: NRC US460 승인·검토 페이지 · SEC NuScale Q3 2026 10-Q/8-K · NuScale Q3 2026 자료</text>
  <text x="72" y="575" font-family="Arial, sans-serif" font-size="13" fill="#475569">단위·기간: MWe(모듈 출력), GW(최대 프로그램), USD·Q3 2026/2026-09-30. 수주·투자 조언 아님.</text>
