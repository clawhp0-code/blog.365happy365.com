  <text x="100" y="458" font-family="Arial, sans-serif" font-size="18" fill="#334155">구속력 있는 PPA/offtake → 금융종결·FID → OEM·구매계약 → COLA·건설허가 → EPC·현장공사 → 반복 매출·상업운전</text>
