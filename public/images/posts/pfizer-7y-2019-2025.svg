<text x="80" y="1843" font-size="21" fill="#506478" font-weight="400" text-anchor="start">¹ 영업이익률 = (매출 − 매출원가 − 판관비 − 연구개발비 − 인수 R&amp;D − 상각비 − 구조조정비) ÷ 매출.</text>
<text x="80" y="1883" font-size="21" fill="#506478" font-weight="400" text-anchor="start">   기타손익·이자 및 별도 표시된 소비자헬스케어 JV 처분이익은 계산에서 제외했습니다.</text>
<text x="80" y="1923" font-size="21" fill="#506478" font-weight="400" text-anchor="start">• 매출: 2019–2020년은 중단사업 제외 재작성치, 2021년은 당기 공시치. 2022년부터 로열티 재분류 반영으로 표시 기준 차이.</text>
<text x="80" y="1963" font-size="21" fill="#506478" font-weight="400" text-anchor="start">• 순이익: 중단사업 포함. 특히 2019년 JV 처분이익 등이 반영되어 영업이익률과 직접 대응하지 않습니다.</text>
<text x="80" y="2003" font-size="21" fill="#506478" font-weight="400" text-anchor="start">• 2020년 Upjohn 분사로 사업 범위가 바뀌었습니다. 연말 시가총액도 동일 사업 범위 비교가 아닙니다.</text>
<text x="80" y="2073" font-size="21" fill="#506478" font-weight="400" text-anchor="start">출처: Pfizer SEC 2021·2024·2025 연차보고서 / CompaniesMarketCap 연말 시총. 확인: 2026-11-04.</text>
<text x="80" y="2110" font-size="20" fill="#506478" font-weight="400" text-anchor="start">금액은 소수 첫째 자리로 반올림. 2026년 분기·예상 실적 제외. 상세 수치와 출처는 별도 검증 메모 참조.</text>
