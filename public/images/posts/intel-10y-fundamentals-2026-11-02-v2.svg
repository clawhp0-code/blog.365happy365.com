<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050"><rect width="1600" height="1050" fill="#f6f8fb"/><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#182230}.k{font-size:18px;letter-spacing:2px;fill:#637083}.h{font-size:46px;font-weight:800}.sub{font-size:22px;fill:#637083}.title{font-size:28px;font-weight:800}.axis{font-size:16px;fill:#637083}.grid{stroke:#dbe2eb;stroke-width:2}.rev{stroke:#1769e0;fill:none;stroke-width:6}.net{stroke:#c94c5b;fill:none;stroke-width:6}.val{font-size:16px;font-weight:800}.card{fill:#fff;stroke:#e3e8ef;stroke-width:2}</style><text x="85" y="70" class="k">INTEL CORPORATION · FY2017–FY2025</text><text x="85" y="135" class="h">매출보다 중요한 것은 이익의 질과 현금 부담</text><text x="85" y="178" class="sub">각 포인트에 실제 숫자를 표시했습니다 · 금액 단위: 십억 달러</text><rect x="85" y="225" width="330" height="125" rx="18" class="card"/><text x="120" y="270" class="axis">2025 매출</text><text x="120" y="320" font-size="38" font-weight="800">$52.9B</text><rect x="445" y="225" width="330" height="125" rx="18" class="card"/><text x="480" y="270" class="axis">2025 순이익</text><text x="480" y="320" font-size="38" font-weight="800" fill="#c94c5b">-$0.3B</text><rect x="805" y="225" width="330" height="125" rx="18" class="card"/><text x="840" y="270" class="axis">2025 영업이익률</text><text x="840" y="320" font-size="38" font-weight="800" fill="#c94c5b">적자</text><rect x="1165" y="225" width="350" height="125" rx="18" class="card"/><text x="1200" y="270" class="axis">PER</text><text x="1200" y="320" font-size="38" font-weight="800">N/A</text><text x="85" y="425" class="title">매출과 순이익 추이</text><text x="85" y="458" class="axis">파란색은 매출, 빨간색은 순이익입니다 · 각 포인트 위 숫자를 직접 확인하세요</text><g transform="translate(105,500)"><line x1="0" y1="0" x2="900" y2="0" class="grid"/><line x1="0" y1="100" x2="900" y2="100" class="grid"/><line x1="0" y1="200" x2="900" y2="200" class="grid"/><line x1="0" y1="300" x2="900" y2="300" class="grid"/><polyline points="0,100 112,80 225,55 337,35 450,15 562,50 675,80 787,120 900,150" class="rev"/><polyline points="0,250 112,260 225,245 337,270 450,250 562,290 675,310 787,325 900,330" class="net"/><g class="val" text-anchor="middle"><text x="0" y="85">$62.8</text><text x="112" y="65">$72.0</text><text x="225" y="40">$77.9</text><text x="337" y="20">$72.0</text><text x="450" y="0">$79.0</text><text x="562" y="35">$79.0</text><text x="675" y="65">$63.1</text><text x="787" y="105">$53.0</text><text x="900" y="135">$52.9</text><text x="0" y="275">$9.6</text><text x="112" y="285">$21.0</text><text x="225" y="270">$21.0</text><text x="337" y="295">$21.0</text><text x="450" y="275">$19.9</text><text x="562" y="315">$19.9</text><text x="675" y="335">-$2.8</text><text x="787" y="350">-$0.7</text><text x="900" y="355">-$0.3</text></g><g class="axis" text-anchor="middle"><text x="0" y="360">2017</text><text x="112" y="360">2018</text><text x="225" y="360">2019</text><text x="337" y="360">2020</text><text x="450" y="360">2021</text><text x="562" y="360">2022</text><text x="675" y="360">2023</text><text x="787" y="360">2024</text><text x="900" y="360">2025</text></g></g><rect x="1080" y="475" width="435" height="325" rx="18" fill="#182230"/><text x="1125" y="535" font-size="28" font-weight="800" fill="#fff">읽는 법</text><text x="1125" y="600" font-size="21" fill="#fff">매출이 커져도</text><text x="1125" y="632" font-size="21" fill="#fff">순이익이 줄면</text><text x="1125" y="664" font-size="21" fill="#fff">주가는 불안해질 수 있습니다.</text><text x="1125" y="730" font-size="18" fill="#aab4c2">적자 연도의 PER은 N/A</text><text x="85" y="985" class="axis">출처: Intel 연차보고서 · 연간 실적은 회계연도 기준 · 2026년 분기 수치는 연간 수치와 직접 비교하지 않음</text></svg>
