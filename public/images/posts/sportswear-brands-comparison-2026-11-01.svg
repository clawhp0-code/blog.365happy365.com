<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#fbfaf7"/><text x="42" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#171717">스포츠웨어 시장, 누가 성장하고 있나</text><text x="42" y="82" font-family="Arial,sans-serif" font-size="16" fill="#666">브랜드별 강점과 주가를 읽는 핵심 지표</text>
<rect x="42" y="112" width="1116" height="270" rx="18" fill="#fff" stroke="#ddd"/><text x="72" y="148" font-family="Arial" font-size="19" font-weight="700">브랜드별 성장 방향</text>
<g font-family="Arial" font-size="16" font-weight="700"><rect x="72" y="175" width="220" height="75" rx="12" fill="#f9e4df"/><text x="92" y="204">나이키</text><text x="92" y="229" font-size="13" font-weight="400">제품·중국·재고 재정비</text><rect x="315" y="175" width="220" height="75" rx="12" fill="#e2edf7"/><text x="335" y="204">아디다스</text><text x="335" y="229" font-size="13" font-weight="400">러닝·축구·중국 회복</text><rect x="558" y="175" width="220" height="75" rx="12" fill="#e4f1e9"/><text x="578" y="204">룰루레몬</text><text x="578" y="229" font-size="13" font-weight="400">프리미엄 일상복</text><rect x="801" y="175" width="220" height="75" rx="12" fill="#eee6f7"/><text x="821" y="204">온·HOKA</text><text x="821" y="229" font-size="13" font-weight="400">러닝·기능성·고성장</text></g>
<g font-family="Arial" font-size="16" font-weight="700"><rect x="72" y="270" width="220" height="75" rx="12" fill="#f7edda"/><text x="92" y="299">푸마</text><text x="92" y="324" font-size="13" font-weight="400">브랜드 경쟁력 재정비</text><rect x="315" y="270" width="220" height="75" rx="12" fill="#e8e8e8"/><text x="335" y="299">VF Corporation</text><text x="335" y="324" font-size="13" font-weight="400">Vans 부진·부채 부담</text><rect x="558" y="270" width="220" height="75" rx="12" fill="#f2e8df"/><text x="578" y="299">살로몬·아크테릭스</text><text x="578" y="324" font-size="13" font-weight="400">아웃도어·프리미엄 확장</text><rect x="801" y="270" width="220" height="75" rx="12" fill="#edf3f5"/><text x="821" y="299">소비자 변화</text><text x="821" y="324" font-size="13" font-weight="400">유명세 → 기능·편안함</text></g>
<rect x="42" y="410" width="1116" height="285" rx="18" fill="#fff" stroke="#ddd"/><text x="72" y="448" font-family="Arial" font-size="19" font-weight="700">주가를 이해하는 4단계</text><g font-family="Arial" text-anchor="middle"><circle cx="175" cy="540" r="54" fill="#2861a5"/><text x="175" y="534" fill="#fff" font-size="20" font-weight="700">매출</text><text x="175" y="557" fill="#fff" font-size="12">성장하는가?</text><circle cx="455" cy="540" r="54" fill="#16823b"/><text x="455" y="534" fill="#fff" font-size="20" font-weight="700">이익률</text><text x="455" y="557" fill="#fff" font-size="12">정가에 팔리는가?</text><circle cx="735" cy="540" r="54" fill="#d66b1d"/><text x="735" y="534" fill="#fff" font-size="20" font-weight="700">재고</text><text x="735" y="557" fill="#fff" font-size="12">할인 위험은?</text><circle cx="1015" cy="540" r="54" fill="#7651a8"/><text x="1015" y="534" fill="#fff" font-size="20" font-weight="700">현금흐름</text><text x="1015" y="557" fill="#fff" font-size="12">실제로 남는가?</text><path d="M235 540H395M515 540H675M795 540H955" stroke="#aaa" stroke-width="3" marker-end="url(#a)"/></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#aaa"/></marker></defs><text x="72" y="655" font-family="Arial" font-size="15" fill="#555">매출이 늘어도 이익률과 현금흐름이 나빠지면 주가는 약해질 수 있습니다.</text><text x="72" y="680" font-family="Arial" font-size="15" fill="#555">반대로 아직 작은 브랜드라도 높은 성장률과 정가 판매가 이어지면 시장의 기대가 커집니다.</text></svg>
