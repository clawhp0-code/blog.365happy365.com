<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1278" viewBox="0 0 840 1278" role="img" aria-labelledby="title desc">
  <title id="title">나스닥 급락 50일, 4·9거래일 뒤의 흐름</title>
  <desc id="desc">1971년부터 2026년 11월 20일까지 나스닥이 하루 5% 이상 하락한 50일을 각각 집계했다. 후속 종가가 확인된 49건의 수익률 중앙값은 4일 +3.67%, 9일 +1.23%로, 각각 30건과 29건이 상승했다. 직전 거래일 종가를 기준으로는 4거래일 뒤 7건이 회복했고 중앙값은 -3.47%, 9거래일 뒤 14건이 회복했고 중앙값은 -5.08%였다. 첫 급락 13건의 중앙값은 +3.47%, -1.47%, 두 번째 급락 7건은 +5.09%, +0.16%였다. 같은 순서로 평균은 전체 +1.43%와 +1.35%, 첫 급락 +0.81%와 -0.76%, 두 번째 급락 +1.03%와 -3.59%였다. 11월 27일은 반등에 조금 더 무게를 두고, 12월 4일은 방향 판단을 유보했다. 두 번째 급락의 9거래일 평균은 두 차례 큰 하락의 영향을 받았다.</desc>
  <rect width="840" height="1278" rx="22" fill="#f2f6f6"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif" fill="#172d3c">
