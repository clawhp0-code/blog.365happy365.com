    <rect x="36" y="549" width="768" height="235" rx="15" fill="#172d3c"/>
    <text x="57" y="586" font-size="24" font-weight="750" fill="#fff">11월 20일 급락 뒤 4·9거래일 전망</text>
    <text x="57" y="615" font-size="20" fill="#c3d8e3">기준 종가 22,617.73 · 날짜는 미국 현지 기준</text>
    <path d="M56 631 H783 M418 647 V766" stroke="#456575"/>
