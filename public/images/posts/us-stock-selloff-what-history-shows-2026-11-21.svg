    <text x="36" y="100" font-size="49" font-weight="800">급락 50건, 반등은 얼마나 갔나</text>
    <text x="38" y="140" font-size="23" fill="#49626e">하루 5% 이상 하락 · 후속 종가 확인 49건</text>

    <rect x="36" y="166" width="768" height="250" rx="15" fill="#172d3c"/>
    <text x="57" y="202" font-size="25" font-weight="750" fill="#fff">4·9거래일 뒤 반등과 회복 · 전체 49건</text>
