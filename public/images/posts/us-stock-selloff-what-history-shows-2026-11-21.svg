      <text x="57" y="284">4거래일</text>
      <text x="202" y="284">30/49 상승 · +3.67%</text>
      <text x="496" y="284">7/49 회복 · -3.47%</text>
      <text x="57" y="344">9거래일</text>
      <text x="202" y="344">29/49 상승 · +1.23%</text>
      <text x="496" y="344">14/49 회복 · -5.08%</text>
    </g>
    <text x="57" y="387" font-size="17" fill="#c3d8e3">수익률은 각 기준 대비 중앙값 · 회복은 급락 직전 거래일 종가 이상</text>

