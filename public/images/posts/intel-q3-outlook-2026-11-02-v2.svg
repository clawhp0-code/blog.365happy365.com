<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f6f8fb"/><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#182230}.k{font-size:18px;letter-spacing:2px;fill:#637083}.h{font-size:48px;font-weight:800}.sub{font-size:24px;fill:#637083}.label{font-size:20px;font-weight:700;fill:#637083}.num{font-size:38px;font-weight:800}.small{font-size:19px;fill:#637083}.card{stroke:#e3e8ef;stroke-width:2}.blue{fill:#1769e0}.orange{fill:#f08a24}</style><text x="85" y="70" class="k">INTEL · FISCAL Q3 2026</text><text x="85" y="135" class="h">매출은 늘었는데, 다음 분기는 왜 약할까?</text><text x="85" y="178" class="sub">좋았던 실적과 앞으로의 전망을 한 장에서 분리해 읽습니다</text><rect x="85" y="225" width="430" height="155" rx="20" fill="#fff" class="card"/><text x="120" y="270" class="label">3분기 실제 매출</text><text x="120" y="332" class="num">$16.5B</text><text x="325" y="332" font-size="25" font-weight="700" fill="#17824b">+21% YoY</text><rect x="550" y="225" width="430" height="155" rx="20" fill="#fff" class="card"/><text x="585" y="270" class="label">4분기 매출 전망</text><text x="585" y="332" class="num">$15–16B</text><text x="815" y="332" font-size="25" font-weight="700" fill="#c66b16">다음 분기 둔화</text><rect x="1015" y="225" width="500" height="155" rx="20" fill="#fff" class="card"/><text x="1050" y="270" class="label">4분기 조정 EPS 전망</text><text x="1050" y="332" class="num">$0.25</text><text x="1245" y="332" font-size="25" font-weight="700" fill="#c94c5b">이익 기대 약화</text><text x="85" y="455" font-size="30" font-weight="800">사업별 성장 방향</text><text x="85" y="495" class="small">막대 끝의 숫자가 매출 규모와 전년 대비 증감을 함께 보여줍니다</text><text x="85" y="560" class="label">데이터센터·AI</text><rect x="85" y="580" width="690" height="62" rx="12" class="blue"/><text x="805" y="623" font-size="27" font-weight="800">$7.3B  ·  +78%</text><text x="85" y="710" class="label">클라이언트 컴퓨팅·피지컬 AI</text><rect x="85" y="730" width="520" height="62" rx="12" class="orange"/><text x="635" y="773" font-size="27" font-weight="800">$8.1B  ·  -5%</text><rect x="930" y="475" width="585" height="330" rx="20" fill="#182230"/><text x="975" y="530" font-size="28" font-weight="800" fill="#fff">읽는 순서</text><circle cx="985" cy="600" r="24" fill="#5aa1ff"/><text x="978" y="608" font-size="20" font-weight="800" fill="#fff">1</text><text x="1030" y="608" font-size="22" fill="#fff">실제로 벌어들인 매출</text><circle cx="985" cy="675" r="24" fill="#f6a23a"/><text x="978" y="683" font-size="20" font-weight="800" fill="#fff">2</text><text x="1030" y="683" font-size="22" fill="#fff">성장을 만든 사업</text><circle cx="985" cy="750" r="24" fill="#ee7180"/><text x="978" y="758" font-size="20" font-weight="800" fill="#fff">3</text><text x="1030" y="758" font-size="22" fill="#fff">다음 분기 이익 전망</text><text x="85" y="920" class="small">자료: Intel 2026년 3분기 실적발표 · 매출·EPS 전망은 회사 발표 기준 · 수치는 미감사</text></svg>
