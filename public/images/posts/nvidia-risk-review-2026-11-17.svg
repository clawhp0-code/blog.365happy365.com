<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#111827"/>
  <rect x="36" y="32" width="1128" height="696" rx="24" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <text x="72" y="92" fill="#f9fafb" font-family="Arial, sans-serif" font-size="32" font-weight="700">NVIDIA 경영진 교체·중국 수출통제 점검</text>
  <text x="72" y="126" fill="#9ca3af" font-family="Arial, sans-serif" font-size="17">자료 기준: 2026.11.17 (3분기 실적 발표 전) | 확정 사실과 미확인 보도를 구분</text>
  <rect x="72" y="160" width="500" height="190" rx="16" fill="#0f766e"/>
  <text x="100" y="202" fill="#ccfbf1" font-family="Arial, sans-serif" font-size="22" font-weight="700">확정 (공시·공식 발표)</text>
  <text x="100" y="242" fill="#f0fdfa" font-family="Arial, sans-serif" font-size="18">11.11 젠슨 황 사임, Kress 임시 CEO</text>
  <text x="100" y="274" fill="#f0fdfa" font-family="Arial, sans-serif" font-size="18">11.17 국가안보·수출통제 감독위 설치</text>
  <text x="100" y="306" fill="#f0fdfa" font-family="Arial, sans-serif" font-size="18">사임 사유·조사 결과는 비공개</text>
  <rect x="600" y="160" width="500" height="190" rx="16" fill="#92400e"/>
  <text x="628" y="202" fill="#fef3c7" font-family="Arial, sans-serif" font-size="22" font-weight="700">미확인 (언론 보도·의혹)</text>
  <text x="628" y="242" fill="#fffbeb" font-family="Arial, sans-serif" font-size="18">중국 정보요원 의혹, 칩 전용 의혹</text>
  <text x="628" y="274" fill="#fffbeb" font-family="Arial, sans-serif" font-size="18">익명 출처, 당사자 미확인</text>
  <text x="628" y="306" fill="#fffbeb" font-family="Arial, sans-serif" font-size="18">의회 브리핑 일정 매체별 상이</text>
  <text x="72" y="402" fill="#f9fafb" font-family="Arial, sans-serif" font-size="24" font-weight="700">10-Q 중국 관련 수치 (2026.7.26 종료 분기)</text>
  <rect x="72" y="426" width="500" height="150" rx="14" fill="#111827" stroke="#4b5563"/>
  <text x="100" y="466" fill="#d1d5db" font-family="Arial, sans-serif" font-size="18">중국(홍콩 포함) 매출 78.8억 달러</text>
  <text x="100" y="500" fill="#d1d5db" font-family="Arial, sans-serif" font-size="18">총매출 962.2억 달러 (중국 약 8%, 직접 계산)</text>
  <text x="100" y="534" fill="#d1d5db" font-family="Arial, sans-serif" font-size="18">H200 출하: 데이터센터 매출의 1% 미만</text>
  <rect x="600" y="426" width="500" height="150" rx="14" fill="#111827" stroke="#4b5563"/>
  <text x="628" y="466" fill="#d1d5db" font-family="Arial, sans-serif" font-size="18">H20 충당 45억 달러 (FY2026 1분기)</text>
  <text x="628" y="500" fill="#d1d5db" font-family="Arial, sans-serif" font-size="18">H200 충당 4억 달러 (FY2027 상반기)</text>
  <text x="628" y="534" fill="#d1d5db" font-family="Arial, sans-serif" font-size="18">3분기 가이던스 1,080억 ±2%, 중국 제외</text>
  <rect x="72" y="604" width="1028" height="84" rx="14" fill="#111827" stroke="#4b5563"/>
  <text x="100" y="640" fill="#f9fafb" font-family="Arial, sans-serif" font-size="19" font-weight="700">다음에 확인할 것</text>
  <text x="100" y="670" fill="#d1d5db" font-family="Arial, sans-serif" font-size="17">3분기 실적·4분기 가이던스 · 정식 CEO 선임 · 조사 결과 · 의회 일정</text>
  <text x="72" y="716" fill="#9ca3af" font-family="Arial, sans-serif" font-size="14">출처: SEC 8-K, NVIDIA 10-Q·뉴스룸, 하원 서한, BIS | 교육용 자료, 투자 권유 아님</text>
</svg>
