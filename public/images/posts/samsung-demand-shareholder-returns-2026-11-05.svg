<text x="1030" y="1293" font-size="40" fill="#5c7288" font-weight="400" text-anchor="start">=</text>
<rect x="90" y="1390" width="1420" height="120" rx="22" fill="#e8e1f3"/>
<text x="800" y="1442" font-size="30" fill="#684495" font-weight="700" text-anchor="middle">2027년 1월 말 이사회에서 최종 규모·실행 방안 확정 예정</text>
<text x="800" y="1483" font-size="22" fill="#5c7288" font-weight="400" text-anchor="middle">현금배당 + 자사주 매입·소각  /  잔여 재원 전액이 즉시 자사주 매입되는 것은 아닙니다.</text>
<text x="90" y="1544" font-size="22" fill="#5c7288" font-weight="400" text-anchor="start">회사 계획은 변경될 수 있습니다. 개별 매입·소각 실행 공시와 완료 내역을 확인해야 합니다.</text>
<text x="65" y="1640" font-size="25" fill="#172e46" font-weight="700" text-anchor="start">확인할 것: 고객 주문·메모리 가격 / 후속 분기 실적·현금흐름 / 환원 방식과 집행 일정</text>
<text x="65" y="1700" font-size="22" fill="#5c7288" font-weight="400" text-anchor="start">출처: 삼성전자 2026년 3분기 실적 발표(10/29), SBS 정규장 마감 보도(11/5).</text>
<text x="65" y="1744" font-size="21" fill="#5c7288" font-weight="400" text-anchor="start">단위: 금액은 조원, 지수는 포인트. 주가 전망이나 매수·매도 신호를 제시한 그림이 아닙니다.</text>
<text x="65" y="1783" font-size="21" fill="#5c7288" font-weight="400" text-anchor="start">자료 확인: 2026-11-05. 시장 해석·회사 계획과 확정된 실적을 구분했습니다.</text>
