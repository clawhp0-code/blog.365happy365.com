<text x="520" y="1005" font-size="40" fill="#5c7288" font-weight="400" text-anchor="start">→</text>
<text x="1020" y="1005" font-size="40" fill="#5c7288" font-weight="400" text-anchor="start">→</text>
<text x="90" y="1093" font-size="23" fill="#5c7288" font-weight="400" text-anchor="start">AI 데이터센터 투자 지연 우려가 곧 삼성전자의 확정 매출 감소를 뜻하지는 않습니다.</text>
<rect x="55" y="1160" width="1490" height="410" rx="22" fill="white"/>
<text x="90" y="1215" font-size="30" fill="#172e46" font-weight="700" text-anchor="start">04  주주환원  |  규모와 실행 시점을 함께 확인</text>
<text x="300" y="1300" font-size="43" fill="#7451a4" font-weight="700" text-anchor="middle">90~110조원</text>
<text x="300" y="1347" font-size="22" fill="#5c7288" font-weight="400" text-anchor="middle">2026년 총 환원 예상</text>
<text x="800" y="1300" font-size="43" fill="#7451a4" font-weight="700" text-anchor="middle">35조원</text>
<text x="800" y="1347" font-size="22" fill="#5c7288" font-weight="400" text-anchor="middle">이미 집행·확정</text>
