  <text x="1260" y="395" font-family="Arial,Apple SD Gothic Neo,sans-serif" font-size="23" fill="#33445d">지속성 확인</text>
  <rect x="100" y="475" width="1400" height="235" rx="20" fill="#fff8e9"/>
  <text x="135" y="530" font-family="Arial,Apple SD Gothic Neo,sans-serif" font-size="28" font-weight="700" fill="#8b5c08">한국은행이 제시한 변동성 위험</text>
  <rect x="140" y="570" width="285" height="92" rx="14" fill="#ffe7d1"/><text x="170" y="625" font-family="Arial,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#8e4e12">글로벌 장기금리</text>
  <rect x="465" y="570" width="285" height="92" rx="14" fill="#e5efff"/><text x="515" y="625" font-family="Arial,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#26558f">통화정책 기대</text>
  <rect x="790" y="570" width="285" height="92" rx="14" fill="#f4e7f5"/><text x="845" y="625" font-family="Arial,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#7a3e80">AI 산업 우려</text>
  <rect x="1115" y="570" width="285" height="92" rx="14" fill="#e5f5e9"/><text x="1168" y="625" font-family="Arial,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#277046">가계부채·주택</text>
  <rect x="100" y="760" width="1400" height="135" rx="20" fill="#12233d"/>
  <text x="135" y="810" font-family="Arial,Apple SD Gothic Neo,sans-serif" font-size="25" font-weight="700" fill="#fff">확인 순서</text>
  <text x="320" y="810" font-family="Arial,Apple SD Gothic Neo,sans-serif" font-size="24" fill="#fff">정규장 종가 → 상승 폭·거래대금 → 매출·현금흐름</text>
  <text x="135" y="855" font-family="Arial,Apple SD Gothic Neo,sans-serif" font-size="20" fill="#cbd6e6">정책 기대만으로 매수 결론을 내리지 않고, 다음 공시에서 지속성을 확인합니다.</text>
  <text x="100" y="930" font-family="Arial,Apple SD Gothic Neo,sans-serif" font-size="17" fill="#718096">자료: 한국은행 금융시장동향·금통위 의사록·한국거래소 거래시간 안내. 교육용 요약입니다.</text>
