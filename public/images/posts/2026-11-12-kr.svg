<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f6f8fb"/>
  <rect x="50" y="40" width="1500" height="920" rx="28" fill="#fff" stroke="#d8e1ee" stroke-width="3"/>
  <text x="95" y="112" font-family="Arial,Apple SD Gothic Neo,sans-serif" font-size="40" font-weight="700" fill="#12233d">코스닥 정책 기대와 변동성 점검</text>
  <text x="95" y="155" font-family="Arial,Apple SD Gothic Neo,sans-serif" font-size="22" fill="#62738b">2026년 11월 12일 16:30 KST · 정규장 종가 숫자는 공식 갱신 전이라 제외</text>
  <rect x="100" y="205" width="1400" height="220" rx="20" fill="#eef4ff"/>
  <text x="135" y="255" font-family="Arial,Apple SD Gothic Neo,sans-serif" font-size="28" font-weight="700" fill="#24518f">정책 기대가 주가로 전달되는 경로</text>
  <line x1="190" y1="345" x2="1410" y2="345" stroke="#c4d2e5" stroke-width="5"/>
  <circle cx="250" cy="345" r="36" fill="#3169c6"/><text x="239" y="356" font-family="Arial" font-size="26" fill="#fff">1</text>
  <circle cx="610" cy="345" r="36" fill="#5b8fcb"/><text x="599" y="356" font-family="Arial" font-size="26" fill="#fff">2</text>
  <circle cx="970" cy="345" r="36" fill="#e1a13c"/><text x="959" y="356" font-family="Arial" font-size="26" fill="#fff">3</text>
  <circle cx="1330" cy="345" r="36" fill="#a85b73"/><text x="1319" y="356" font-family="Arial" font-size="26" fill="#fff">4</text>
